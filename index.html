    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pak_tajarat_branding_config');
          if (saved) {
            var cfg = JSON.parse(saved);
            if (cfg && cfg.faviconUrl) {
              var favLink = document.getElementById('dynamic-app-favicon');
              if (favLink) {
                favLink.href = cfg.faviconUrl;
              }
            }
            if (cfg && cfg.customText) {
              document.title = cfg.customText + " - " + (cfg.brandTagline || "Trusted Digital Marketplace");
            }
          }
        } catch(e) {}
      })();
    </script>
