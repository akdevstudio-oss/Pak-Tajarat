<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">Ak DeV Studio — 3D Tech Company Banner</title>
<desc id="desc">Wide cinematic dark technology-company banner with a dimensional silver and neon-green AK logo, company name, tagline, service list, and modern workspace silhouettes.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050a09"/><stop offset=".5" stop-color="#15221d"/><stop offset="1" stop-color="#05090a"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#c5d0cc"/><stop offset="1" stop-color="#64716b"/></linearGradient>
 <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c7ff72"/><stop offset=".42" stop-color="#20fa64"/><stop offset="1" stop-color="#007a3b"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#00ff63" stop-opacity=".24"/><stop offset="1" stop-color="#00ff63" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#6cff9c" stroke-opacity=".045"/></pattern>
 <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/><feOffset dy="9" result="off"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="700" fill="url(#bg)"/><rect width="1600" height="700" fill="url(#grid)"/><ellipse cx="800" cy="330" rx="560" ry="340" fill="url(#glow)"/>
<!-- architectural light strips -->
<path d="M40 0V700M60 0V700M0 82H320M0 92H270" stroke="#e9b46a" stroke-opacity=".42" stroke-width="3"/><path d="M300 0H570M300 16H500M1120 0H1410" stroke="#20fa64" stroke-width="5" stroke-opacity=".75"/>
<!-- left workstation silhouette -->
<path d="M0 460 210 460 315 635 0 635Z" fill="#080d0d" stroke="#45554e" stroke-width="3"/><path d="M35 475H210L280 600H35Z" fill="#17201e"/><path d="M35 475H210L280 600H35Z" fill="none" stroke="#52625b" stroke-width="2"/><path d="M0 640H1600" stroke="#20fa64" stroke-opacity=".7" stroke-width="3"/><path d="M0 645H1600" stroke="#20fa64" stroke-opacity=".15" stroke-width="14"/>
<!-- right window -->
<path d="M1350 60H1580V510H1350Z" fill="#0b1818" stroke="#465a53" stroke-width="3"/><path d="M1465 60V510M1350 290H1580" stroke="#40564e" stroke-width="4"/><path d="M1360 75H1455V275H1360Z" fill="#274d55" opacity=".4"/><path d="M1475 75H1570V275H1475Z" fill="#39616a" opacity=".32"/>
<!-- centered emblem -->
<g filter="url(#shadow)">
 <path d="M560 275 665 105 782 315 715 315 665 222 620 275Z" fill="#27342e" transform="translate(6 9)"/>
 <path d="M560 275 665 105 782 315 715 315 665 222 620 275Z" fill="url(#metal)" stroke="#fff" stroke-opacity=".65" stroke-width="2"/>
 <path d="M735 315 850 105 925 105 820 315Z" fill="url(#green)" stroke="#aaffbf" stroke-opacity=".6" stroke-width="2"/>
 <path d="M815 300 875 300 940 405 865 405Z" fill="url(#green)" stroke="#aaffbf" stroke-opacity=".5" stroke-width="2"/>
 <path d="M530 285C610 360 860 365 965 205" fill="none" stroke="#003d22" stroke-width="34" stroke-linecap="round" transform="translate(0 8)"/>
 <path d="M530 285C610 360 860 365 965 205" fill="none" stroke="url(#green)" stroke-width="25" stroke-linecap="round"/>
 <path d="M537 279C625 345 858 350 962 203" fill="none" stroke="#d7ffad" stroke-opacity=".8" stroke-width="2"/>
</g>
<text x="800" y="475" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#metal)">Ak DeV <tspan fill="#30f477">Studio</tspan></text>
<text x="800" y="522" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" letter-spacing="8" fill="#edf5f0">IDEAS <tspan fill="#30f477">|</tspan> CODE <tspan fill="#30f477">|</tspan> REAL SOLUTIONS</text>
<text x="800" y="563" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="2" fill="#9baea3">TURNING IDEAS INTO REALITY</text>
<!-- services -->
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
 <g fill="#37ff7a" font-size="27" font-weight="bold"><text x="330" y="615">&lt;/&gt;</text><text x="565" y="615">▣</text><text x="800" y="615">✧</text><text x="1035" y="615">☁</text><text x="1270" y="615">⚙</text></g>
 <g fill="#e8f1eb" font-size="15"><text x="330" y="644">WEB DEVELOPMENT</text><text x="565" y="644">MOBILE APPS</text><text x="800" y="644">UI/UX DESIGN</text><text x="1035" y="644">CLOUD SOLUTIONS</text><text x="1270" y="644">SOFTWARE SOLUTIONS</text></g>
</g>
<text x="800" y="682" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="4" fill="#c2d2c9">AK DEV STUDIO  |  BUILDING DIGITAL FUTURES</text>
</svg>